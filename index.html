<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SafeWork</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#101828;--mut:#475467;--line:#dde3ea;--brand:#0b5cab;--navy:#0f2a47;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b141d;--card:#122030;--ink:#e6edf4;--mut:#9fb0c1;--line:#25384b;--brand:#2b7fd6;--navy:#0a1a2c}}
:root[data-theme=dark]{--bg:#0b141d;--card:#122030;--ink:#e6edf4;--mut:#9fb0c1;--line:#25384b;--brand:#2b7fd6;--navy:#0a1a2c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0 0 .5em;font-weight:600;letter-spacing:-.01em;line-height:1.2}
h1{font-size:30px}h2{font-size:22px;margin-top:8px}h3{font-size:16px}
.mut,small{color:var(--mut)}.err{color:#b42318;min-height:1.3em;margin:4px 0;font-size:14px}
.main{max-width:640px;margin:auto;padding:0 16px 96px}
.topbar{display:flex;justify-content:space-between;align-items:center;height:54px}
.logo{font-weight:600;font-size:17px}
.logo::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;background:var(--brand);border-radius:2px}
.lk{background:none;border:0;color:var(--brand);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;padding:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin:0 0 12px}
label{display:block;font-weight:500;font-size:14px;margin:0 0 14px}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:88px;resize:vertical}
.btn{width:100%;padding:11px 16px;border:0;border-radius:6px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}.btn.s{width:auto;padding:7px 14px;font-size:14px}
.chip{padding:5px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.pill{display:inline-flex;align-items:center;padding:1px 9px;border-radius:4px;font-size:12.5px;font-weight:500;white-space:nowrap;color:color-mix(in srgb,var(--c) 70%,var(--ink));background:color-mix(in srgb,var(--c) 11%,var(--card));border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{display:flex;flex-direction:column;gap:2px;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.act:hover{border-color:var(--brand)}.act b{font-weight:600}.act span{font-size:13px;color:var(--mut)}.act .ico{color:var(--brand);margin-bottom:8px}
.act.big{grid-column:1/-1;background:var(--brand);border-color:var(--brand);color:#fff}.act.big span,.act.big .ico{color:#dbe9f8}
.kpi{padding:12px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;background:var(--card)}
.kpi b{display:block;font-size:26px;font-weight:600;line-height:1.1}.kpi span{font-size:12.5px;color:var(--mut)}
.k5{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.bar{display:grid;grid-template-columns:120px 1fr 24px;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--brand)}.bar b{text-align:right;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0;padding-bottom:0}
.banner{padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;background:var(--card);margin-bottom:16px;font-weight:500}
.al{display:flex;align-items:center;border-left:4px solid var(--c)}
.hist{font-size:13.5px;color:var(--mut);margin:10px 0 0;padding-left:18px}
.sug{margin:-6px 0 14px;font-size:14px}
.yn{display:flex;gap:8px;position:relative}.yn label{flex:1;margin:0}
.yn input{position:absolute;opacity:0;width:1px;height:1px}
.yn span{display:block;text-align:center;padding:9px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.yn input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.yn input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:0;background:none;color:var(--mut);font:inherit;font-size:11.5px;cursor:pointer}
nav button.on{color:var(--brand);font-weight:600}
.toast{position:fixed;left:16px;right:16px;bottom:84px;max-width:480px;margin:auto;padding:12px 16px;border-radius:8px;background:#0f2a47;color:#fff;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.lg{min-height:100vh;display:flex;flex-direction:column}
.lgb{background:var(--navy);color:#fff;padding:28px 24px}.lgb .logo{color:#fff;margin-bottom:24px}.lgb .logo::before{background:#fff}
.lgb h1{font-size:25px;max-width:460px}.lgb ul{margin:14px 0 0;padding-left:18px;color:#c4d2e1;max-width:460px}.lgb li{margin:6px 0}.lgb p{color:#9fb3c8;font-size:13px;margin:22px 0 0}
.lgf{padding:24px;max-width:440px;width:100%;margin:0 auto}
.acc{display:flex;justify-content:space-between;width:100%;padding:9px 12px;margin-top:6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
@media(max-width:899px){.side{display:contents}.side .logo,.who{display:none}}
@media(min-width:900px){
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 14px;background:var(--navy);color:#fff;display:flex;flex-direction:column}
.side .logo{padding:0 12px 20px;color:#fff}.side .logo::before{background:#fff}.topbar{display:none}
.main{max-width:none;width:100%;padding:36px 44px}.main>*{max-width:920px}h2{font-size:26px}
nav{position:static;flex-direction:column;background:none;border:0;gap:2px;padding:0}
nav button{flex-direction:row;gap:12px;padding:10px 12px;border-radius:6px;font-size:14.5px;color:#c4d2e1;text-align:left}
nav button:hover{background:rgba(255,255,255,.07)}nav button.on{background:rgba(255,255,255,.14);color:#fff}
.who{display:block;margin-top:auto;padding:14px 12px 0;border-top:1px solid rgba(255,255,255,.15);font-size:14px}.who span{display:block;color:#aab9c9;font-size:13px}.who .lk{color:#fff}
.k5{grid-template-columns:repeat(5,1fr)}
.lg{flex-direction:row}.lgb{flex:1.1;display:flex;flex-direction:column;justify-content:center;padding:64px}.lgb h1{font-size:38px}
.lgf{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:none;padding:64px;margin:0}.lgf>*{max-width:400px}}
@media print{nav,.topbar,.side,.who,.noprint{display:none!important}.app{display:block}.main{padding:0;max-width:none}.card,.kpi{break-inside:avoid;border-color:#999}body{background:#fff;color:#000}}</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I={home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/>',check:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 14l2 2 4-4"/>',shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',team:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 5a3.5 3.5 0 0 1 0 6.5M18 14a6 6 0 0 1 3.5 6"/>',file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>'};
const ic=n=>'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>';
const ST=['Aberta','Em análise','Em correção','Resolvida','Encerrada'],SC=['#b42318','#a15c00','#b54708','#1a7f4b','#475467'];
const TIPOS=['Mecânico','Elétrico','Químico','Físico','Ergonômico','Incêndio','Queda','Falha de equipamento','Outro'];
const SET=['Produção','Manutenção','Estoque','Logística','Administrativo','Laboratório'],GR=['Baixa','Média','Alta'];
const PF={f:'Funcionário',s:'Supervisor',a:'Administrador'};
let U=[{id:'joao',nome:'João Silva',p:'f',setor:'Produção'},{id:'ana',nome:'Ana Lima',p:'f',setor:'Manutenção'},{id:'maria',nome:'Maria Souza',p:'s',setor:'Segurança'},{id:'admin',nome:'Administrador',p:'a',setor:'Administrativo'}];
const dd=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)},days=s=>Math.round((new Date(s)-new Date())/864e5)+1;
const fmt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const ago=h=>new Date(Date.now()-h*36e5).toISOString();
const mk=(id,uid,tipo,setor,local,desc,gr,st,h)=>({id,uid,tipo,setor,local,desc,gr,st,foto:'',hist:Array.from({length:st+1},(_,i)=>[i,ago(h-i*2),i?'Maria Souza':U.find(u=>u.id==uid).nome])});
const D={
 epis:{joao:[['Capacete',dd(450)],['Óculos',dd(300)],['Luvas',dd(25)],['Protetor auricular',dd(240)]],ana:[['Capacete',dd(380)],['Luvas',dd(200)],['Botina',dd(40)]]},
 trs:{joao:[['Segurança do trabalho',dd(200)],['Primeiros socorros',dd(120)],['Segurança elétrica',null],['Combate a incêndio',dd(12)]],ana:[['Segurança do trabalho',dd(150)],['Segurança elétrica',dd(90)]]},
 verifs:[],chk:[{uid:'ana',dia:dd(0),risco:false}],
 occs:[mk(1,'joao','Elétrico','Produção','Máquina 04','Cabo exposto na área de circulação',2,0,3),mk(2,'ana','Elétrico','Produção','Máquina 04','Tomada com fio descascado',2,1,40),mk(3,'joao','Elétrico','Produção','Máquina 02','Fiação solta atrás do painel',1,0,90),mk(4,'ana','Queda','Manutenção','Corredor B','Óleo no chão perto da bancada',1,2,60),mk(5,'joao','Ergonômico','Estoque','Prateleira 3','Caixas pesadas acima da altura do ombro',0,3,120)]
};
let S={c:{},u:null,v:'home',open:null,fl:'',sg:null};
function pr(o){const f=D.occs.filter(x=>x.id!=o.id&&x.tipo==o.tipo&&x.setor==o.setor&&x.st<3).length,s=o.gr+1+Math.min(f,2);return s>=5?['Crítica','#b42318',s]:s==4?['Alta','#b54708',s]:s==3?['Média','#a15c00',s]:['Baixa','#1a7f4b',s]}
const pill=(t,c)=>`<span class=pill style="--c:${c}">${t}</span>`;
const epiS=v=>{const n=days(v);return n<0?['Vencido','#b42318']:n<=60?['Troca próxima','#b54708']:['Entregue','#1a7f4b']};
const trS=v=>{if(!v)return['Pendente','#b42318'];const n=days(v);return n<=30?[`Vence em ${n} dias`,'#b54708']:['Em dia','#1a7f4b']};
const emps=()=>U.filter(u=>u.p=='f'),done=uid=>D.chk.some(c=>c.uid==uid&&c.dia==dd(0));
const RULES=[[/óleo|escorreg|degrau|piso|molhado|queda/i,'Queda',2],[/cabo|fio|choque|elétric|tomada|fiação/i,'Elétrico',2],[/fogo|fumaça|incêndio|extintor/i,'Incêndio',2],[/químic|vazamento|gás|produto/i,'Químico',1],[/máquina|proteção|equipamento|peça/i,'Falha de equipamento',1],[/peso|postura|repetitiv|ombro/i,'Ergonômico',1],[/ruído|barulho|calor|temperatura/i,'Físico',1]];
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}
const opt=(a,s)=>a.map(x=>`<option${x==s?' selected':''}>${x}</option>`).join('');
function R(){$('#app').innerHTML=S.u?shell():login()}
function go(v){S.v=v;S.open=null;R();scrollTo(0,0)}
const CFG={url:'https://deeeyzzkhryxuqxyxmja.supabase.co/rest/v1/',key:'sb_publishable_Yg04aGy7DNzIplnVBNuQhg_U0-cOTbg'}; // Cole aqui a URL e a chave pública (anon/publishable) do seu projeto Supabase
const ON=()=>!!(CFG.url&&CFG.key);let TK=null;
async function api(p,o={}){const r=await fetch(CFG.url+p,{...o,headers:{apikey:CFG.key,Authorization:'Bearer '+(TK||CFG.key),'Content-Type':'application/json',Prefer:'return=representation',...(o.headers||{})}}),t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){j=t}if(!r.ok)throw new Error((j&&(j.msg||j.message||j.error_description))||r.statusText);return j}
async function loadAll(){const g=t=>api('/rest/v1/'+t+(t.includes('?')?'&':'?')+'select=*'),[pf,oc,ck,ep,tr]=await Promise.all([g('profiles'),g('occurrences?order=id'),g('checklists'),g('epis'),g('trainings')]);
U=pf.map(x=>({id:x.id,nome:x.nome||x.email,p:x.perfil,setor:x.setor||''}));
D.occs=oc.map(o=>({id:o.id,uid:o.uid,tipo:o.tipo,setor:o.setor,local:o.local,desc:o.descr,gr:o.gr,st:o.st,foto:'',hist:o.hist}));
D.chk=ck.map(c=>({uid:c.uid,dia:c.dia,risco:c.risco}));D.epis={};D.trs={};D.verifs=[];
ep.forEach(e=>(D.epis[e.uid]=D.epis[e.uid]||[]).push([e.nome,e.validade]));tr.forEach(t=>(D.trs[t.uid]=D.trs[t.uid]||[]).push([t.nome,t.validade]))}
async function boot(id){await loadAll();S.u=U.find(u=>u.id==id);if(!S.u)throw new Error('Perfil não encontrado');S.v=S.u.p=='f'?'home':'dash';R()}
function login(){const on=ON();return `<div class=lg><section class=lgb><div class=logo>SafeWork</div><h1>Gestão de segurança do trabalho em um só lugar</h1><ul><li>Registro de riscos pelo celular, em poucos toques</li><li>Alertas e acompanhamento até a resolução</li><li>Checklist diário, EPIs e treinamentos</li></ul><p>Projeto SESI Day 2026.${on?'':' Dados fictícios para demonstração.'}</p></section><section class=lgf><h2>Acessar o sistema</h2><form onsubmit="doLogin();return false">${on?'<label>Nome (só para criar conta)<input id=ln autocomplete=name></label>':''}<label>${on?'E-mail':'Usuário'}<input id=lu ${on?'type=email':'value=joao'} autocapitalize=off autocomplete=username></label><label>Senha<input id=lp type=password ${on?'':'value=1234'} autocomplete=current-password></label><p id=le class=err role=alert></p><button class=btn>Entrar</button>${on?'<p style="margin:10px 0 0"><button type=button class=chip onclick="signUp()">Criar conta de funcionário</button></p>':''}</form>${on?'':`<h3 style="margin-top:28px">Contas de demonstração</h3><p class=mut style="margin:0 0 6px">Senha de todas: 1234</p>${U.map(u=>`<button type=button class=acc onclick="$('#lu').value='${u.id}'"><span>${u.nome}</span><span class=mut>${PF[u.p]}</span></button>`).join('')}`}</section></div>`}
async function doLogin(){if(ON()){try{const j=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('#lu').value.trim(),password:$('#lp').value})});TK=j.access_token;await boot(j.user.id)}catch(x){$('#le').textContent='Não foi possível entrar: '+x.message}return}
const u=U.find(x=>x.id==$('#lu').value.trim().toLowerCase());if(!u||$('#lp').value!='1234'){$('#le').textContent='Usuário ou senha incorretos.';return}S.u=u;S.v=u.p=='f'?'home':'dash';R()}
async function signUp(){const e=$('#lu').value.trim(),p=$('#lp').value;if(!e||p.length<6){$('#le').textContent='Informe o e-mail e uma senha com 6 ou mais caracteres.';return}try{const j=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:e,password:p,data:{nome:$('#ln').value.trim()||e.split('@')[0]}})});if(j&&j.access_token){TK=j.access_token;await boot(j.user.id)}else $('#le').textContent='Conta criada. Confirme o e-mail e depois entre.'}catch(x){$('#le').textContent=x.message}}
function shell(){const f=S.u.p=='f',N=f?[['home','home','Início'],['risk','alert','Risco'],['chk','check','Checklist'],['epi','shield','EPIs'],['mine','list','Minhas']]:[['dash','chart','Painel'],['occ','alert','Ocorrências'],['team','team','Equipe'],['alr','bell','Alertas'],['rel','file','Relatório']];
return `<div class=app><aside class=side><div class=logo>SafeWork</div><nav aria-label="Principal">${N.map(n=>`<button class="${S.v==n[0]?'on':''}" onclick="go('${n[0]}')">${ic(n[1])}<span>${n[2]}</span></button>`).join('')}</nav><div class=who><b>${S.u.nome}</b><span>${PF[S.u.p]}</span><button class=lk onclick="S.u=null;R()">Sair</button></div></aside><main class=main><header class=topbar><span class=logo>SafeWork</span><button class=lk onclick="S.u=null;R()">Sair (${S.u.nome.split(' ')[0]})</button></header>${V[S.v]()}</main></div>`}
function occCard(o,mgr){const p=pr(o),op=S.open==o.id;return `<div class=card><div onclick="S.open=${op?0:o.id};R()" style="cursor:pointer"><div class=top><b>${o.tipo}: ${esc(o.local)}</b>${pill(ST[o.st],SC[o.st])}</div><div class=mut>${o.setor} · ${fmt(o.hist[0][1])} · ${U.find(u=>u.id==o.uid).nome}</div><p style="margin:6px 0">${esc(o.desc)}</p>${pill('Prioridade '+p[0],p[1])} ${pill('Gravidade '+GR[o.gr],'#475467')}</div>${o.foto?`<img src="${o.foto}" alt="Foto do risco" style="max-width:100%;border-radius:8px;margin-top:8px">`:''}${op?`<ul class=hist>${o.hist.map(h=>`<li>${ST[h[0]]} — ${fmt(h[1])} por ${h[2]}</li>`).join('')}</ul>`:''}${mgr&&o.st<4?`<p style="margin:10px 0 0"><button class="btn s" onclick="adv(${o.id})">${o.st==0?'Assumir ocorrência':'Marcar como '+ST[o.st+1].toLowerCase()}</button></p>`:''}</div>`}
async function adv(id){const o=D.occs.find(x=>x.id==id);o.st++;o.hist.push([o.st,new Date().toISOString(),S.u.nome]);if(ON())try{await api('/rest/v1/occurrences?id=eq.'+id,{method:'PATCH',body:JSON.stringify({st:o.st,hist:o.hist})})}catch(e){o.st--;o.hist.pop();toast('Erro ao salvar: '+e.message);return}toast('Status: '+ST[o.st]);R()}
function sug(){const t=$('#fd').value,r=RULES.find(x=>x[0].test(t));S.sg=r;$('#sg').innerHTML=r?`<div class=sug>Sugestão: <b>${r[1]}</b>, gravidade ${GR[r[2]]} <button class="chip" onclick="useSug()">Usar</button></div>`:''}
function useSug(){$('#ft').value=S.sg[1];$('#fg').value=S.sg[2]}
async function send(){const d=$('#fd').value.trim(),l=$('#fl').value.trim();if(!d||!l){toast('Preencha a descrição e o local.');return}const fp=$('#fp').files[0],id=Math.max(...D.occs.map(o=>o.id))+1,o=mk(id,S.u.id,$('#ft').value,$('#fs').value,l,d,+$('#fg').value,0,0);o.hist=[[0,new Date().toISOString(),S.u.nome]];o.foto=fp?URL.createObjectURL(fp):'';if(ON())try{const r=await api('/rest/v1/occurrences',{method:'POST',body:JSON.stringify({uid:S.u.id,tipo:o.tipo,setor:o.setor,local:o.local,descr:o.desc,gr:o.gr,st:0,hist:o.hist})});o.id=r[0].id}catch(e){toast('Erro ao salvar: '+e.message);return}D.occs.push(o);toast(`Alerta enviado: ${o.tipo}, ${o.setor}, gravidade ${GR[o.gr]}`);go('mine')}
function saveChk(){const q=[0,1,2,3].map(i=>{const e=document.querySelector(`input[name=c${i}]:checked`);return e?e.value:null});if(q.includes(null)){toast('Responda todas as perguntas.');return}const risco=q[3]=='1';D.chk.push({uid:S.u.id,dia:dd(0),risco});S.c={};if(ON())api('/rest/v1/checklists',{method:'POST',body:JSON.stringify({uid:S.u.id,dia:dd(0),risco})}).catch(e=>toast('Erro ao salvar: '+e.message));if(risco){toast('Checklist salvo. Descreva a situação de risco.');go('risk')}else{toast('Checklist concluído');go('home')}}

async function shrink(f){const b=await createImageBitmap(f),k=Math.min(1,800/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.8))}
async function onPhoto(i){const f=i.files[0];if(!f)return;try{const b=await shrink(f);S.ph={blob:b,url:URL.createObjectURL(b),res:null}}catch(e){toast('Não foi possível ler a foto.')}R()}
const EPQ={'Capacete':['a hard hat','a safety helmet'],'Óculos':['safety goggles','safety glasses'],'Luvas':['work gloves'],'Protetor auricular':['ear muffs'],'Botina':['work boots']};
async function localDetect(req){if(!window.__det){const {pipeline}=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');window.__det=await pipeline('zero-shot-object-detection','Xenova/owlvit-base-patch32',{progress_callback:p=>{const e=$('#pm');if(e&&p.status=='progress')e.textContent='Baixando o modelo de IA: '+Math.round(p.progress)+'% (só na primeira vez)'}})}
const q=[...new Set(req.flatMap(k=>EPQ[k]||[]))],o=await window.__det(S.ph.url,q,{threshold:0.1});
return Object.fromEntries(req.map(k=>[k,o.some(x=>(EPQ[k]||[]).includes(x.label)&&x.score>=0.15)]))}
async function analyze(){const req=(D.epis[S.u.id]||[]).map(e=>e[0]);S.ph.busy=1;S.ph.err=0;R();let sm=null;try{sm=await window.claude?.use('sample')}catch(e){}
try{if(sm&&(await sm.limits()).images){const t=await sm(`Você confere EPIs em uma foto. Para cada item da lista, diga se ele está visível e sendo usado pela pessoa. Lista: ${JSON.stringify(req)}. Responda SOMENTE com JSON no formato {"Item":true ou false}, usando exatamente os nomes da lista. Se a foto não mostrar uma pessoa, use false em todos.`,{images:[S.ph.blob],cache:false});const j=JSON.parse(t.text.replace(/```json|```/g,'').trim());S.ph.res=Object.fromEntries(req.map(k=>[k,!!j[k]]))}else{S.ph.res=await localDetect(req)}S.ph.src='IA'}catch(e){console.error(e);S.ph.err=1;S.ph.errm=String((e&&e.message)||e)}S.ph.busy=0;R()}
function sendV(){const p=S.ph;D.verifs.push({id:D.verifs.length+1,uid:S.u.id,url:p.url,dt:new Date().toISOString(),res:p.res,src:p.src||'',st:0});S.ph=null;toast('Foto enviada para conferência do supervisor');R()}
function decide(id,st){D.verifs.find(v=>v.id==id).st=st;toast(st==1?'Comprovação aprovada':'Comprovação rejeitada');R()}
const resList=(r,s)=>`<div style="margin-bottom:10px"><small>Sugestão da análise automática${s?' (IA, pode errar)':''}</small>${Object.entries(r).map(([k,v])=>`<div class=row><span>${k}</span>${pill(v?'Detectado':'Não detectado',v?'#1a7f4b':'#b42318')}</div>`).join('')}</div>`;
function vCard(v,m){return `<div class=card><div class=top><b>${U.find(x=>x.id==v.uid).nome}</b>${pill(['Aguardando conferência','Aprovada','Rejeitada'][v.st],['#a15c00','#1a7f4b','#b42318'][v.st])}</div><small>${fmt(v.dt)}</small><img src="${v.url}" alt="Foto de comprovação de EPIs" style="display:block;max-width:100%;max-height:280px;object-fit:contain;border-radius:8px;margin:8px 0">${v.res?resList(v.res,v.src):'<p class=mut>Sem análise automática. Conferência manual.</p>'}${m&&v.st==0?`<button class="btn s" onclick="decide(${v.id},1)">Aprovar</button> <button class=chip onclick="decide(${v.id},2)">Rejeitar</button>`:''}</div>`}
function verifCard(){const p=S.ph,my=D.verifs.filter(v=>v.uid==S.u.id).reverse();return `<h2>Comprovação de EPIs por foto</h2><div class=card><p class=mut style="margin-top:0">Tire uma foto sua usando os EPIs. O supervisor confere e aprova. Use apenas fotos de pessoas que autorizaram.</p><label>Foto<input type=file accept="image/*" capture=user onchange="onPhoto(this)"></label>${p?`<img src="${p.url}" alt="Prévia da foto" style="display:block;max-width:100%;max-height:280px;object-fit:contain;border-radius:8px;margin-bottom:12px">${p.busy?'<p class=mut id=pm>Analisando a foto...</p>':p.res?resList(p.res,p.src):'<button class="btn s" onclick=analyze()>Analisar com IA</button>'}${p.err?`<p class=err>Não foi possível fazer a análise automática (ela precisa de internet na primeira vez). Envie a foto para conferência manual. <small>Detalhe técnico: ${esc(p.errm||'')}</small></p>`:''}<p style="margin:12px 0 0"><button class=btn onclick=sendV()>Enviar para conferência</button></p>`:''}</div>${my.map(v=>vCard(v,0)).join('')}`}
const vsec=()=>D.verifs.length?`<h3>Comprovações de EPI por foto</h3>${[...D.verifs].reverse().map(v=>vCard(v,1)).join('')}<h3>Colaboradores</h3>`:'';
const V={
home(){const u=S.u,ok=done(u.id),pend=(D.epis[u.id]||[]).some(e=>epiS(e[1])[0]!='Entregue')||(D.trs[u.id]||[]).some(t=>trS(t[1])[0]!='Em dia'),g=ok&&!pend;
return `<h2>Olá, ${u.nome.split(' ')[0]}!</h2><div class=banner style="--c:${g?'#1a7f4b':'#a15c00'}">${g?'Segurança atualizada':'Você tem pendências'}${ok?'':'<br><small>Checklist de hoje ainda não feito</small>'}</div><div class=grid><button class="act big" onclick="go('risk')"><i class=ico>${ic('alert')}</i><b>Registrar risco</b><span>Informe um problema encontrado no ambiente</span></button><button class=act onclick="go('chk')"><i class=ico>${ic('check')}</i><b>Checklist diário</b><span>Antes de começar o trabalho</span></button><button class=act onclick="go('epi')"><i class=ico>${ic('shield')}</i><b>EPIs e treinamentos</b><span>Validades e pendências</span></button><button class=act onclick="go('mine')" style="grid-column:1/-1"><i class=ico>${ic('list')}</i><b>Minhas ocorrências</b><span>Acompanhe o andamento dos riscos que você registrou</span></button></div>`},
risk(){return `<h2>Registrar risco</h2><div class=card><label>O que você encontrou?<textarea id=fd oninput=sug() placeholder="Ex.: óleo vazando perto da máquina"></textarea></label><div id=sg></div><label>Tipo de risco<select id=ft>${opt(TIPOS)}</select></label><label>Setor<select id=fs>${opt(SET,S.u.setor)}</select></label><label>Local<input id=fl placeholder="Ex.: Máquina 04"></label><label>Gravidade<select id=fg><option value=0>Baixa</option><option value=1>Média</option><option value=2>Alta</option></select></label><label>Foto (opcional)<input type=file accept="image/*" id=fp></label><button class=btn onclick=send()>ENVIAR ALERTA</button></div>`},
chk(){if(done(S.u.id))return `<h2>Checklist diário</h2><div class=banner style="--c:#1a7f4b">Checklist de hoje concluído.</div>${verifCard()}`;const Q=['EPIs adequados?','Área de trabalho segura?','Equipamentos funcionando corretamente?','Existe alguma situação de risco?'];
return `<h2>Checklist diário</h2>${Q.map((q,i)=>`<div class=card><b>${q}</b><div class=yn style="margin-top:8px"><label><input type=radio name=c${i} value=1 onchange="S.c[${i}]=1"${S.c[i]===1?' checked':''}><span>Sim</span></label><label><input type=radio name=c${i} value=0 onchange="S.c[${i}]=0"${S.c[i]===0?' checked':''}><span>Não</span></label></div></div>`).join('')}${verifCard()}<button class=btn onclick=saveChk()>SALVAR CHECKLIST</button>`},
epi(){const u=S.u.id;return `<h2>Meus EPIs</h2><div class=card>${(D.epis[u]||[]).map(e=>{const s=epiS(e[1]);return `<div class=row><span>${e[0]}<br><small class=mut>Validade ${e[1].split('-').reverse().slice(1).join('/')}</small></span>${pill(s[0],s[1])}</div>`}).join('')||'Nenhum EPI registrado.'}</div><h2>Meus treinamentos</h2><div class=card>${(D.trs[u]||[]).map(t=>{const s=trS(t[1]);return `<div class=row><span>${t[0]}</span>${pill(s[0],s[1])}</div>`}).join('')}</div>`},
mine(){const l=D.occs.filter(o=>o.uid==S.u.id).reverse();return `<h2>Minhas ocorrências</h2>${l.map(o=>occCard(o,0)).join('')||'<p class=mut>Você ainda não registrou nenhum risco.</p>'}`},
dash(){const O=D.occs,by=(a,f)=>a.map(k=>[k,O.filter(o=>f(o)==k).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]),bars=a=>{const m=Math.max(1,...a.map(x=>x[1]));return a.map(x=>`<div class=bar><span>${x[0]}</span><i style="width:${x[1]/m*100}%"></i><b>${x[1]}</b></div>`).join('')};
const E=emps(),tp=E.reduce((n,u)=>n+(D.trs[u.id]||[]).filter(t=>trS(t[1])[0]!='Em dia').length,0),ep=E.reduce((n,u)=>n+(D.epis[u.id]||[]).filter(e=>epiS(e[1])[0]!='Entregue').length,0);
return `<h2>Painel de segurança</h2><div class=k5><div class=kpi style="--c:#0f2a47"><b>${O.length}</b><span>Total</span></div>${ST.slice(0,4).map((s,i)=>`<div class=kpi style="--c:${SC[i]}"><b>${O.filter(o=>o.st==i).length}</b><span>${s}</span></div>`).join('')}</div><div class=card><h3>Riscos por categoria</h3>${bars(by(TIPOS,o=>o.tipo))}</div><div class=card><h3>Riscos por setor</h3>${bars(by(SET,o=>o.setor))}</div><div class=card><h3>Riscos por gravidade</h3>${bars(by(GR,o=>GR[o.gr]))}</div><div class=card><h3>Funcionários</h3><div class=row><span>Treinamentos pendentes ou vencendo</span><b>${tp}</b></div><div class=row><span>EPIs próximos da validade</span><b>${ep}</b></div><div class=row><span>Checklists feitos hoje</span><b>${E.filter(u=>done(u.id)).length} de ${E.length}</b></div></div>`},
occ(){const l=[...D.occs].filter(o=>!S.fl||o.st==S.fl).sort((a,b)=>pr(b)[2]-pr(a)[2]||b.id-a.id);return `<h2>Ocorrências</h2><label>Filtrar por status<select onchange="S.fl=this.value;R()"><option value="">Todos</option>${ST.map((s,i)=>`<option value=${i}${S.fl==i&&S.fl!==''?' selected':''}>${s}</option>`).join('')}</select></label>${l.map(o=>occCard(o,1)).join('')||'<p class=mut>Nenhuma ocorrência neste status.</p>'}`},
team(){return `<h2>Equipe</h2>${vsec()}${emps().map(u=>`<div class=card><div class=top><b>${u.nome}</b>${pill(done(u.id)?'Checklist feito':'Checklist pendente',done(u.id)?'#1a7f4b':'#b42318')}</div><div class=mut>${u.setor}</div>${(D.epis[u.id]||[]).map(e=>{const s=epiS(e[1]);return `<div class=row><span>${e[0]} <small>(EPI)</small></span>${pill(s[0],s[1])}</div>`}).join('')}${(D.trs[u.id]||[]).map(t=>{const s=trS(t[1]);return `<div class=row><span>${t[0]} <small>(treinamento)</small></span>${pill(s[0],s[1])}</div>`}).join('')}</div>`).join('')}`},
alr(){const E=emps(),cr=D.occs.filter(o=>pr(o)[0]=='Crítica'&&o.st<2).length,tp=E.reduce((n,u)=>n+(D.trs[u.id]||[]).filter(t=>trS(t[1])[0]!='Em dia').length,0),ep=E.reduce((n,u)=>n+(D.epis[u.id]||[]).filter(e=>epiS(e[1])[0]!='Entregue').length,0),ck=E.filter(u=>!done(u.id)).length,ab=D.occs.filter(o=>o.st==0).length,pv=D.verifs.filter(v=>v.st==0).length;
const A=[[cr,'#b42318',`${cr} risco(s) crítico(s) aguardando análise`],[ab,'#b54708',`${ab} ocorrência(s) aberta(s) sem responsável`],[tp,'#b54708',`${tp} treinamento(s) pendente(s) ou vencendo`],[ep,'#b54708',`${ep} EPI(s) próximo(s) da validade`],[ck,'#475467',`${ck} checklist(s) não realizado(s) hoje`],[pv,'#b54708',`${pv} comprovação(ões) de EPI aguardando conferência`]].filter(a=>a[0]);
return `<h2>Central de alertas</h2>${A.map(a=>`<div class="card al" style="--c:${a[1]}">${a[2]}</div>`).join('')||'<p class=mut>Tudo em dia.</p>'}`}};
const mesOpts=()=>{const m=new Set(D.occs.map(o=>o.hist[0][1].slice(0,7)));m.add(new Date().toISOString().slice(0,7));return[...m].sort().reverse()};
const relData=()=>{const m=S.rm||mesOpts()[0];return{m,l:D.occs.filter(o=>o.hist[0][1].slice(0,7)==m)}};
const tmed=l=>{const t=l.map(o=>{const r=o.hist.find(h=>h[0]==3);return r?(new Date(r[1])-new Date(o.hist[0][1]))/36e5:null}).filter(x=>x!=null);return t.length?t.reduce((a,b)=>a+b)/t.length:null};
V.rel=function(){const{m,l}=relData(),res=l.filter(o=>o.st>=3).length,tm=tmed(l),by=(a,f)=>a.map(k=>[k,l.filter(o=>f(o)==k).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]),tb=(t,a)=>`<div class=card><h3>${t}</h3>${a.length?a.map(x=>`<div class=row><span>${x[0]}</span><b>${x[1]}</b></div>`).join(''):'<p class=mut>Sem dados.</p>'}</div>`,pend=l.filter(o=>o.st<3);
return `<h2>Relatório mensal de segurança</h2><div class="card noprint"><label>Mês<select onchange="S.rm=this.value;R()">${mesOpts().map(x=>`<option${x==m?' selected':''}>${x}</option>`).join('')}</select></label><button class="btn s" onclick="print()">Imprimir ou salvar em PDF</button> <button class=chip onclick="csv()">Exportar CSV</button></div><p class=mut>Mês de referência: ${m}. Gerado em ${fmt(new Date())} por ${esc(S.u.nome)}.</p><div class=k5><div class=kpi style="--c:#0f2a47"><b>${l.length}</b><span>Ocorrências</span></div><div class=kpi style="--c:#1a7f4b"><b>${res}</b><span>Resolvidas</span></div><div class=kpi style="--c:#b54708"><b>${pend.length}</b><span>Pendentes</span></div><div class=kpi style="--c:#475467"><b>${tm==null?'-':tm<48?Math.round(tm)+' h':(tm/24).toFixed(1)+' d'}</b><span>Tempo médio de resolução</span></div></div>${tb('Por tipo de risco',by(TIPOS,o=>o.tipo))}${tb('Por setor',by(SET,o=>o.setor))}${tb('Por gravidade',by(GR,o=>GR[o.gr]))}${tb('Por status',by(ST,o=>ST[o.st]))}<div class=card><h3>Situações pendentes</h3>${pend.map(o=>`<div class=row><span>${o.tipo}: ${esc(o.local)} (${o.setor})</span>${pill(ST[o.st],SC[o.st])}</div>`).join('')||'<p class=mut>Nenhuma pendência.</p>'}</div>`};
function csv(){const{m,l}=relData(),q=v=>'"'+String(v).replace(/"/g,'""')+'"',L=[['ID','Data','Funcionário','Tipo','Setor','Local','Gravidade','Status','Último responsável','Descrição'].map(q).join(',')];l.forEach(o=>L.push([o.id,fmt(o.hist[0][1]),(U.find(u=>u.id==o.uid)||{}).nome||'',o.tipo,o.setor,o.local,GR[o.gr],ST[o.st],o.hist[o.hist.length-1][2],o.desc].map(q).join(',')));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='safework-'+m+'.csv';a.click()}

R();
</script></body></html>
